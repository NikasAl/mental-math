version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mental_math_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mm_password}
      POSTGRES_DB: ${DB_NAME:-mental_math_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mm_user} -d ${DB_NAME:-mental_math_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
